<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Distraction-Free TTS Reader</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>📖 Distraction-Free TTS Reader</h1>
    <p>Paste or speak your text below and hit "Read Aloud"</p>

    <textarea id="textInput" placeholder="Paste or type text..."></textarea><br>
<div id="displayArea"></div>
<br>

    <label for="voiceSelect">Voice:</label>
    <select id="voiceSelect"></select>

    <label for="rateControl">Speed:</label>
    <input type="range" id="rateControl" min="0.5" max="2" step="0.1" value="1"><br>

    <button id="readBtn">🔊 Read Aloud</button>
    <button id="stopBtn">⏹ Stop</button>

    <p id="nudge">Need a reminder to stay focused? 😊</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
